<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiên Long Group — E-commerce Sales Dashboard</title>
  <meta name="description" content="E-commerce Sector Performance Dashboard for Thien Long Group: gross sales, units, platform mix, brand share, price segments and top SKUs.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Thiên Long Group — E-commerce Sales Dashboard">
  <meta property="og:description" content="Market share, brand performance, platform breakdown, and top SKU rankings across key stationery categories.">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Thien_Long_Logo.svg/320px-Thien_Long_Logo.svg.png">
  <meta property="og:locale" content="vi_VN">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          },
          colors: {
            brand: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 500: '#3b82f6', 600: '#1a56db', 700: '#1e40af', 900: '#0b1f4d' }
          },
          boxShadow: {
            soft: '0 1px 2px rgba(15,23,42,.04), 0 6px 20px -6px rgba(15,23,42,.08)'
          }
        }
      }
    };
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-2xl bg-white shadow-soft ring-1 ring-slate-200/70; }
      .card-title { @apply text-base font-semibold text-slate-900; }
      .card-sub { @apply mt-0.5 text-xs text-slate-500; }
      .pill { @apply inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-full px-3.5 py-1.5 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500; }
      .pill-on { @apply bg-brand-600 text-white shadow-sm; }
      .pill-off { @apply bg-white text-slate-600 ring-1 ring-inset ring-slate-200 hover:bg-slate-50 hover:text-slate-900; }
      .seg-btn { @apply rounded-lg px-3 py-1.5 text-xs font-semibold transition; }
      .seg-on { @apply bg-white text-slate-900 shadow-sm; }
      .seg-off { @apply text-slate-500 hover:text-slate-800; }
    }
  </style>
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fadeUp .35s ease both; }
    /* Chuyển kỳ không tải lại trang: nội dung mờ đi rồi hiện lại */
    .fade-target { transition: opacity .2s ease, transform .2s ease; }
    .fade-target.is-fading { opacity: 0; transform: translateY(6px); }
    @media (prefers-reduced-motion: reduce) { .fade-target { transition: none; } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      .card { box-shadow: none !important; break-inside: avoid; }
    }
  </style>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-700 antialiased">
  <div class="mx-auto max-w-[1440px] px-4 py-6 sm:px-6 lg:px-8 lg:py-8">

    <!-- ===== HEADER (Z-flow: brand trái, bộ lọc kỳ phải) ===== -->
    <header class="flex flex-col gap-5 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-4">
        <div class="grid h-12 w-12 shrink-0 place-items-center rounded-2xl bg-brand-600 text-lg font-extrabold text-white shadow-soft">TL</div>
        <div class="min-w-0">
          <p class="text-xs font-semibold uppercase tracking-wider text-brand-600" id="periodLabel">Strategic Report</p>
          <h1 class="truncate text-xl font-bold tracking-tight text-slate-900 sm:text-2xl">E-commerce Sales Dashboard</h1>
          <p id="scopeLine" class="text-sm text-slate-500">Thiên Long Group · Metric market data</p>
        </div>
      </div>

      <!-- Chọn kỳ: mọi kỳ hiện sẵn dạng tab (không ẩn trong dropdown) -->
      <div class="no-print flex min-w-0 flex-col gap-2 md:items-end">
        <div class="flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wider text-slate-500">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Kỳ báo cáo
        </div>
        <div id="periodTabs" role="tablist" aria-label="Kỳ báo cáo" class="no-scrollbar flex w-fit max-w-full items-center gap-1 overflow-x-auto rounded-2xl bg-white p-1 shadow-sm ring-1 ring-slate-200"></div>
        <div id="comparePeriod" class="flex items-center gap-1.5 text-xs text-slate-500"></div>
      </div>
    </header>

    <!-- ===== BỘ LỌC CATEGORY / SUB-CATEGORY ===== -->
    <nav class="no-print mt-6 space-y-3" aria-label="Bộ lọc danh mục">
      <div id="catPills" class="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 sm:mx-0 sm:flex-wrap sm:px-0"></div>
      <div id="subPills" class="no-scrollbar -mx-4 flex gap-2 overflow-x-auto px-4 sm:mx-0 sm:flex-wrap sm:px-0"></div>
    </nav>

    <!-- ===== 4 KPI ===== -->
    <section id="kpis" class="fade-target mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4 xl:gap-6" aria-label="Chỉ số chính"></section>

    <!-- ===== KEY INSIGHTS (tự sinh từ số) ===== -->
    <section id="insightCard" class="fade-target card mt-6 overflow-hidden" aria-label="Key Insights"></section>

    <!-- ===== PHÂN TÍCH (F-flow: danh sách trái, biểu đồ phải) ===== -->
    <!-- 2 hàng thẳng mép: [xếp hạng | trend], [thương hiệu | sàn + giá]. Card cùng hàng cao bằng nhau. -->
    <section class="fade-target mt-6 grid grid-cols-1 gap-6 lg:grid-cols-12">
      <div id="rankCard" class="card min-w-0 p-5 sm:p-6 lg:col-span-4"></div>
      <div id="trendCard" class="card min-w-0 p-5 sm:p-6 lg:col-span-8"></div>
      <div id="brandCard" class="card min-w-0 p-5 sm:p-6 lg:col-span-4"></div>
      <div class="grid min-w-0 grid-cols-1 gap-6 md:grid-cols-2 lg:col-span-8">
        <div id="platCard" class="card min-w-0 p-5 sm:p-6"></div>
        <div id="priceCard" class="card min-w-0 p-5 sm:p-6"></div>
      </div>
    </section>

    <!-- ===== TOP SKU ===== -->
    <section id="skuCard" class="fade-target card mt-6 overflow-hidden"></section>

    <footer class="mt-8 flex flex-col gap-1 border-t border-slate-200 pt-5 text-xs text-slate-400 sm:flex-row sm:justify-between">
      <span>Thiên Long Group — Confidential · E-commerce Intelligence Report</span>
      <span>Nguồn: Metric · Doanh số theo VND</span>
    </footer>
  </div>

  <!-- ===== DATA: danh mục + màu + engine, rồi file số gốc các kỳ ===== -->
  <script>
    /* ===== DATASETS — thêm kỳ mới vào đây (tab hiện công khai) ===== */
    var DATASETS = [
      { p: 'q1', label: 'Q1 2026' },
      { p: 'q2', label: 'Q2 2026' },
      { p: 'q3', label: 'Q3 2026' },
      { p: 'ytdh1', label: 'YTD 2026' }
    ];
    var DEFAULT_P = 'q3';          // kỳ mở mặc định khi URL không có ?p=
    var curP = (new URLSearchParams(location.search).get('p') || DEFAULT_P).replace(/[^a-z0-9]/g, '');
  </script>
  <script src="data/catalog.js"></script>
  <script src="data/brand_colors.js"></script>
  <script src="data/ecom_engine.js"></script>
  <script>
    /* Nạp file data của mọi kỳ trong DATASETS (cho trend theo quý) và kỳ đang xem */
    (function () {
      var need = DATASETS.map(function (d) { return d.p; });
      if (need.indexOf(curP) < 0) need.push(curP);
      need.forEach(function (p) { document.write('<scr' + 'ipt src="data/2026/ecom_data_' + p + '.js"><\/scr' + 'ipt>'); });
    })();
  </script>
  <script>
    /* ===== ENGINE: số gốc → PERIOD, CAT, MONTHLY, RAW ===== */
    var PERIOD, CAT, MONTHLY, RAW, DATA_ERROR = '';
    try { var _b = ECOM.build(curP); PERIOD = _b.PERIOD; CAT = _b.CAT; MONTHLY = _b.MONTHLY; RAW = _b.RAW; }
    catch (e) { DATA_ERROR = e.message; console.error(e); }
  </script>

  <script>
    /* ===================== APP ===================== */
    var QS = new URLSearchParams(location.search);
    var curCat = QS.get('cat') || 'all';
    var curSub = QS.get('sub') || 'all';
    var trendMode = 'q';          // 'q' = theo quý, 'm' = theo tháng
    var skuPlat = 'all';          // lọc bảng SKU theo sàn
    var CH = {};                  // Chart.js instances
    var QB = {};                  // cache ECOM.build theo kỳ
    if (typeof _b !== 'undefined' && _b) QB[curP] = _b;
    var switching = null;         // timer khi đang chuyển kỳ

    var PLAT = {};
    ECOM_CATALOG.platforms.forEach(function (p) { PLAT[p.k] = p; });
    var BC_LC = {};
    Object.keys(typeof BRAND_COLORS !== 'undefined' ? BRAND_COLORS : {}).forEach(function (k) { BC_LC[k.toLowerCase()] = BRAND_COLORS[k]; });

    /* ---------- tiện ích ---------- */
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function isNum(x) { return typeof x === 'number' && isFinite(x); }
    function fmtTy(v) {
      if (!isNum(v)) return '—';
      return v >= 1 ? v.toFixed(1) + ' Tỷ' : (v * 1000).toFixed(1) + ' Tr';
    }
    function pct(cur, pre, g) {
      var x = isNum(g) ? g : (pre > 0 ? (cur / pre - 1) * 100 : null);
      if (x === null) return '';
      var r = Math.round(x);
      return (r > 0 ? '+' : '') + r + '%';
    }
    function rgba(hex, a) {
      var h = hex.replace('#', '');
      if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
      var n = parseInt(h, 16);
      return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    function yearOf(label) { var m = String(label).match(/(\d{4})\s*$/); return m ? m[1] : label; }
    function brandColor(n) { return BC_LC[String(n || '').toLowerCase()] || '#94a3b8'; }

    /* Badge tăng trưởng màu ngữ nghĩa: xanh = tăng, đỏ = giảm, xám = không đổi / không có */
    function badge(g) {
      if (!g) return '<span class="inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-500">—</span>';
      var v = parseFloat(g);
      var cls = v > 0 ? 'bg-emerald-50 text-emerald-700 ring-emerald-600/20'
        : v < 0 ? 'bg-rose-50 text-rose-700 ring-rose-600/20'
          : 'bg-slate-100 text-slate-600 ring-slate-500/20';
      var arrow = v > 0 ? '▲' : v < 0 ? '▼' : '■';
      return '<span class="inline-flex shrink-0 items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold tabular-nums ring-1 ring-inset ' + cls + '"><span class="text-[9px]">' + arrow + '</span>' + esc(g) + '</span>';
    }
    function emptyState(msg) {
      return '<div class="grid h-full min-h-[180px] place-items-center rounded-xl border border-dashed border-slate-200 bg-slate-50/60 p-6 text-center text-sm text-slate-400">' + esc(msg) + '</div>';
    }
    function cardHead(icon, title, sub, right) {
      return '<div class="mb-5 flex flex-wrap items-start justify-between gap-3">' +
        '<div class="flex items-start gap-3"><span class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-slate-100 text-base">' + icon + '</span>' +
        '<div><h2 class="card-title">' + esc(title) + '</h2>' + (sub ? '<p class="card-sub">' + esc(sub) + '</p>' : '') + '</div></div>' +
        (right || '') + '</div>';
    }
    function mkChart(id, cfg) {
      if (CH[id]) { CH[id].destroy(); delete CH[id]; }
      var el = document.getElementById(id);
      if (el) CH[id] = new Chart(el, cfg);
    }

    /* ---------- dữ liệu theo scope ---------- */
    function scopeDisplay() {
      var c = CAT[curCat];
      if (curSub !== 'all' && c.sdata && c.sdata[curSub]) return c.sdata[curSub];
      return c;
    }
    /* Số gốc của scope (cat, sub) trong bộ RAW của 1 kỳ */
    function scopeRaw(raw, cat, sub) {
      if (!raw) return null;
      if (cat === 'all') {
        var list = ECOM_CATALOG.cats.map(function (c) { return raw[c.k] && raw[c.k].all; }).filter(Boolean);
        return list.length ? ECOM.aggregate(list, 'cats') : null;
      }
      return (raw[cat] && raw[cat][sub === 'all' ? 'all' : sub]) || null;
    }
    function scopeName() {
      var c = CAT[curCat];
      var s = c.sc.filter(function (x) { return x.k === curSub; })[0];
      return c.n + (curSub !== 'all' && s ? ' › ' + s.n : '');
    }
    function periodBuild(p) {
      if (!(p in QB)) { try { QB[p] = ECOM.build(p); } catch (e) { QB[p] = null; } }
      return QB[p];
    }

    /* ---------- header & bộ lọc ---------- */
    function renderHeader() {
      document.getElementById('periodLabel').textContent = PERIOD.label;
      document.getElementById('comparePeriod').innerHTML = 'So sánh với cùng kỳ' +
        '<span class="rounded-md bg-slate-100 px-1.5 py-0.5 font-semibold text-slate-700">' + esc(PERIOD.pre) + '</span>';
      document.title = 'Thiên Long Group — E-commerce Dashboard ' + PERIOD.cur;
      var opts = DATASETS.slice();
      if (!opts.some(function (d) { return d.p === curP; })) opts.push({ p: curP, label: PERIOD.cur });
      /* Tách nhóm: quý | kỳ cộng dồn (YTD), ngăn bằng 1 vạch dọc */
      var DATA = typeof ECOM_DATA !== 'undefined' ? ECOM_DATA : {};
      var isCum = function (d) { return !!(DATA[d.p] && DATA[d.p].parts); };
      var tab = function (d) {
        var on = d.p === curP;
        return '<button type="button" role="tab" aria-selected="' + on + '" onclick="switchPeriod(\'' + esc(d.p) + '\')" class="' +
          'inline-flex shrink-0 items-center gap-1.5 whitespace-nowrap rounded-xl px-3.5 py-2 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 ' +
          (on ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900') + '">' +
          (on ? '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>' : '') +
          esc(d.label) + '</button>';
      };
      var q = opts.filter(function (d) { return !isCum(d); }), c = opts.filter(isCum);
      document.getElementById('periodTabs').innerHTML = q.map(tab).join('') +
        (q.length && c.length ? '<span class="mx-1 h-6 w-px shrink-0 bg-slate-200" aria-hidden="true"></span>' : '') +
        c.map(tab).join('');
    }
    /* Góc trên-trái (điểm đầu Z-flow): cho biết đang xem scope nào, kỳ nào */
    function renderScopeLine() {
      var c = CAT[curCat];
      var s = c.sc.filter(function (x) { return x.k === curSub; })[0];
      var icon = curSub !== 'all' && s ? s.i : c.i;
      document.getElementById('scopeLine').innerHTML =
        '<span class="font-semibold text-slate-800">' + icon + ' ' + esc(scopeName()) + '</span>' +
        '<span class="text-slate-400"> · ' + esc(PERIOD.cur) + ' · Shopee, TikTok Shop, Lazada</span>';
    }
    function renderFilters() {
      document.getElementById('catPills').innerHTML = Object.keys(CAT).map(function (k) {
        var v = CAT[k];
        return '<button type="button" class="pill ' + (k === curCat ? 'pill-on' : 'pill-off') + '" onclick="setCat(\'' + k + '\')"><span>' + v.i + '</span>' + esc(v.n) + '</button>';
      }).join('');
      var sc = CAT[curCat].sc;
      var el = document.getElementById('subPills');
      if (curCat === 'all' || sc.length <= 1) { el.innerHTML = ''; el.classList.add('hidden'); return; }
      el.classList.remove('hidden');
      el.innerHTML = '<span class="flex shrink-0 items-center pr-1 text-xs font-semibold uppercase tracking-wider text-slate-400">Sub-category</span>' +
        sc.map(function (s) {
          return '<button type="button" class="pill !py-1 !text-xs ' + (s.k === curSub ? 'pill-on' : 'pill-off') + '" onclick="setSub(\'' + s.k + '\')"><span>' + s.i + '</span>' + esc(s.n) + '</button>';
        }).join('');
    }

    /* ---------- KPI ---------- */
    var KPI_ICON = [
      '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
      '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/></svg>',
      '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>',
      '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z"/><path d="M5 13v8h14v-8"/></svg>'
    ];
    function renderKPIs(d, r) {
      var tt = (r && r.plat && r.plat.tiktok) || [0, 0];
      var pairs = r ? [
        [r.gross.pre, r.gross.cur],
        [r.units.pre, r.units.cur],
        [r.gross.pre > 0 ? tt[1] / r.gross.pre * 100 : null, r.gross.cur > 0 ? tt[0] / r.gross.cur * 100 : null],
        [r.stores.pre, r.stores.cur]
      ] : [[], [], [], []];
      /* Thứ tự hiển thị theo Z-flow: KPI chiến lược (TikTok Market Share) ở điểm cuối, góc dưới-phải.
         Engine trả kpi theo thứ tự: 0 Gross, 1 Units, 2 TikTok Share, 3 Storefronts. */
      var ORDER = [0, 1, 3, 2];
      document.getElementById('kpis').innerHTML = ORDER.filter(function (i) { return d.kpi[i]; }).map(function (i) {
        var k = d.kpi[i];
        var pr = pairs[i] || [];
        var mx = Math.max(pr[0] || 0, pr[1] || 0) || 1;
        function bar(lbl, v, cls) {
          var w = isNum(v) ? Math.max(v / mx * 100, 2) : 0;
          return '<div class="flex items-center gap-2 text-[11px] text-slate-500"><span class="w-[4.5rem] shrink-0 whitespace-nowrap">' + esc(lbl) + '</span>' +
            '<div class="h-1.5 flex-1 overflow-hidden rounded-full bg-slate-100"><div class="h-full rounded-full ' + cls + '" style="width:' + w + '%"></div></div></div>';
        }
        return '<article class="card p-5 sm:p-6">' +
          '<div class="flex items-start justify-between gap-3">' +
          '<div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-50 text-brand-600">' + KPI_ICON[i] + '</span>' +
          '<p class="text-sm font-medium text-slate-500">' + esc(k.l) + '</p></div>' + badge(k.g) + '</div>' +
          '<p class="mt-4 text-3xl font-bold tracking-tight text-slate-900 tabular-nums">' + esc(k.v) +
          (k.u ? '<span class="ml-1.5 text-base font-semibold text-slate-400">' + esc(k.u) + '</span>' : '') + '</p>' +
          '<p class="mt-1 min-h-[1rem] text-xs text-slate-500">' + esc(k.sub || '') + '</p>' +
          '<div class="mt-4 space-y-1.5">' + bar(PERIOD.pre, pr[0], 'bg-slate-300') + bar(PERIOD.cur, pr[1], 'bg-brand-600') + '</div>' +
          '</article>';
      }).join('');
    }

    /* ---------- cột trái: xếp hạng category / sub-category ---------- */
    /* ---------- Key Insights tự sinh ----------
       Insight chỉ dùng số đã hiện trên trang (growth %, pp, Tỷ, thứ hạng). Không tạo chỉ số phái sinh mới. */
    function gNum(cur, pre, g) { return isNum(g) ? g : (pre > 0 ? (cur / pre - 1) * 100 : null); }
    function sg(x) { var r = Math.round(x); return (r > 0 ? '+' : '') + r + '%'; }
    function spp(x) { return (x > 0 ? '+' : '') + x.toFixed(1) + 'pp'; }
    function B(s) { return '<b class="font-semibold text-slate-900">' + esc(s) + '</b>'; }

    function buildInsights(d, r) {
      var out = [];
      if (!r) return out;
      var gG = gNum(r.gross.cur, r.gross.pre, r.gross.g), gU = gNum(r.units.cur, r.units.pre, r.units.g), gS = gNum(r.stores.cur, r.stores.pre, r.stores.g);

      // 1. Doanh số vs sản lượng

      // 2. Sàn
      var plats = (d.plat || []).filter(function (p) { return p.pre > 0; }).map(function (p) { return { n: p.n, cur: p.cur, g: (p.cur / p.pre - 1) * 100 }; });
      if (plats.length) {
        var fast = plats.slice().sort(function (a, b) { return b.g - a.g; })[0];

      }

      // 3. Thương hiệu
      var br = (d.brand || []).filter(function (b) { return b.n !== 'Others'; });
      if (br.length) {
        var lead = br[0], tlIdx = -1;

          if (br[1]) t2 += ' ' + br[1].n + ' đứng #2, cách ' + B((lead.cur - br[1].cur).toFixed(1) + 'pp') + '.';
        } else if (tlIdx > 0) {

          t2 = lead.n + ' dẫn đầu với ' + B(lead.cur.toFixed(1) + '%') + '. Thiên Long đứng #' + (tlIdx + 1) + ' với ' + B(tl.cur.toFixed(1) + '%') + (tl.pre > 0 ? ' (' + B(spp(tl.cur - tl.pre)) + ')' : '') + '.';
        } else {

      }

      // 4. Category / sub-category con
      var kids = [];
      if (curCat === 'all') kids = Object.keys(CAT).filter(function (k) { return k !== 'all' && RAW[k] && RAW[k].all; }).map(function (k) { return { n: CAT[k].n, r: RAW[k].all }; });
      else if (curSub === 'all') kids = CAT[curCat].sc.filter(function (s) { return s.k !== 'all' && RAW[curCat][s.k]; }).map(function (s) { return { n: s.n, r: RAW[curCat][s.k] }; });

        var big = kids.slice().sort(function (a, b) { return b.r.gross.cur - a.r.gross.cur; })[0];

    }

        (lead ? '<span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600">Leading Brand: <b class="text-slate-900">' + esc(lead.v) + '</b> · ' + esc(lead.sub || '') + '</span>' : '') + '</div>';
      var tabs = '<div class="no-print no-scrollbar inline-flex overflow-x-auto rounded-xl bg-slate-100 p-1">' +
        [['all', 'Tất cả sàn']].concat(ECOM_CATALOG.platforms.map(function (p) { return [p.k, p.n]; })).map(function (t) {
          return '<button type="button" class="seg-btn whitespace-nowrap ' + (skuPlat === t[0] ? 'seg-on' : 'seg-off') + '" onclick="setSkuPlat(\'' + t[0] + '\')">' + esc(t[1]) + '</button>';
        }).join('') + '</div>';
      var gCell = function (g) { return g ? badge(g) : '<span class="text-slate-300">—</span>'; };
      var rows = prods.map(function (p, i) {
        var pl = PLAT[p.ch] || { n: p.ch, c: '#64748b' };
        var rk = i < 3 ? ['bg-amber-400 text-white', 'bg-slate-400 text-white', 'bg-orange-300 text-white'][i] : 'bg-slate-100 text-slate-500';
        return '<tr class="transition hover:bg-slate-50/80">' +
          '<td class="py-3.5 pl-5 pr-2 sm:pl-6"><span class="grid h-7 w-7 place-items-center rounded-lg text-xs font-bold ' + rk + '">' + (i + 1) + '</span></td>' +
          '<td class="max-w-[320px] px-3 py-3.5"><p class="line-clamp-2 text-sm font-semibold text-slate-800" title="' + esc(p.n) + '">' + esc(p.n) + '</p>' +
          '<p class="mt-0.5 flex items-center gap-1.5 text-xs text-slate-500"><span class="h-2 w-2 rounded-full" style="background:' + brandColor(p.br) + '"></span>' + esc(p.br) + (p.fm ? ' · ' + esc(p.fm) : '') + '</p></td>' +
          '<td class="whitespace-nowrap px-3 py-3.5"><span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset" style="color:' + pl.c + ';background:' + rgba(pl.c, .08) + ';--tw-ring-color:' + rgba(pl.c, .25) + '">' + esc(pl.n) + '</span></td>' +
          '<td class="hidden whitespace-nowrap px-3 py-3.5 text-right text-sm tabular-nums text-slate-600 md:table-cell">' + esc(p.pr || '—') + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3.5 text-right text-sm font-bold tabular-nums text-slate-900">' + esc(p.rv || '—') + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3.5 text-right">' + gCell(p.g) + '</td>' +
          '<td class="hidden whitespace-nowrap px-3 py-3.5 text-right text-sm tabular-nums text-slate-600 sm:table-cell">' + esc(p.us || '—') + '</td>' +
          '<td class="hidden whitespace-nowrap px-3 py-3.5 text-right lg:table-cell">' + gCell(p.ug) + '</td>' +
          '<td class="hidden whitespace-nowrap px-3 py-3.5 text-right text-sm tabular-nums text-slate-600 xl:table-cell">' + esc(p.re || '—') + '</td>' +
          '<td class="whitespace-nowrap py-3.5 pl-3 pr-5 text-right sm:pr-6">' + (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener" class="inline-grid h-8 w-8 place-items-center rounded-lg text-slate-400 transition hover:bg-brand-50 hover:text-brand-600" title="Xem sản phẩm"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg></a>' : '<span class="text-slate-300">—</span>') + '</td>' +
          '</tr>';
      }).join('');
      var th = 'px-3 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500';
      document.getElementById('skuCard').innerHTML =
        '<div class="flex flex-col gap-4 p-5 sm:p-6 lg:flex-row lg:items-start lg:justify-between">' +
        '<div class="space-y-3">' + cardHead('🏆', 'Top Best-selling SKUs', scopeName() + ' · ' + PERIOD.cur + ' · Gross Sales trên 1 sàn').replace('mb-5', 'mb-0') + chips + '</div>' + tabs + '</div>' +
        (prods.length ? '<div class="overflow-x-auto border-t border-slate-100"><table class="min-w-full divide-y divide-slate-100">' +
          '<thead class="bg-slate-50/70"><tr>' +
          '<th class="py-3 pl-5 pr-2 text-left text-xs font-semibold uppercase tracking-wider text-slate-500 sm:pl-6">#</th>' +
          '<th class="' + th + ' text-left">Product</th>' +
          '<th class="' + th + ' text-left">Platform</th>' +
          '<th class="' + th + ' hidden text-right md:table-cell">Price</th>' +
          '<th class="' + th + ' text-right">Gross Sales</th>' +
          '<th class="' + th + ' text-right">Growth</th>' +
          '<th class="' + th + ' hidden text-right sm:table-cell">Units</th>' +
          '<th class="' + th + ' hidden text-right lg:table-cell">Units Growth</th>' +
          '<th class="' + th + ' hidden text-right xl:table-cell">Reviews</th>' +
          '<th class="py-3 pl-3 pr-5 text-right text-xs font-semibold uppercase tracking-wider text-slate-500 sm:pr-6">Link</th>' +
          '</tr></thead><tbody class="divide-y divide-slate-100 bg-white">' + rows + '</tbody></table></div>'
          : '<div class="border-t border-slate-100 p-6">' + emptyState('Không có SKU nào trong top 10 thuộc sàn này.') + '</div>');
    }

    /* ---------- render tất cả ---------- */
    function renderAll() {
      var d = scopeDisplay();
      var r = scopeRaw(RAW, curCat, curSub);
      renderFilters();
      renderScopeLine();
      renderKPIs(d, r);
      renderInsights(d, r);
      renderRank();
      renderBrand(d);
      renderTrend(r);
      renderPlat(d);
      renderPrice(d);
      renderSKU(d);
    }

    /* ---------- hành động ---------- */
    function syncURL(push) {
      var u = new URL(location.href);
      u.searchParams.set('p', curP);
      if (curCat === 'all') u.searchParams.delete('cat'); else u.searchParams.set('cat', curCat);
      if (curSub === 'all') u.searchParams.delete('sub'); else u.searchParams.set('sub', curSub);
      u.searchParams.delete('slide');
      if (push) history.pushState(null, '', u.toString()); else history.replaceState(null, '', u.toString());
    }
    function setCat(k) { if (!CAT[k] || (k === curCat && curSub === 'all')) return; curCat = k; curSub = 'all'; skuPlat = 'all'; syncURL(); renderAll(); }
    function setSub(s) { if (s === curSub) return; curSub = s; skuPlat = 'all'; syncURL(); renderAll(); }
    function setTrend(m) { trendMode = m; renderTrend(scopeRaw(RAW, curCat, curSub)); }
    function setSkuPlat(p) { skuPlat = p; renderSKU(scopeDisplay()); }
    /* Đổi kỳ ngay trên trang (không tải lại): data mọi kỳ trong DATASETS đã được nạp sẵn. */
    function switchPeriod(p, fromHistory) {
      if (p === curP) return;
      var b = periodBuild(p);
      if (!b) {                                  // kỳ chưa nạp → tải lại trang như cũ
        var u = new URL(location.href); u.searchParams.set('p', p); location.href = u.toString(); return;
      }
      curP = p; PERIOD = b.PERIOD; CAT = b.CAT; MONTHLY = b.MONTHLY; RAW = b.RAW;
      if (!CAT[curCat]) { curCat = 'all'; curSub = 'all'; }
      if (!CAT[curCat].sc.some(function (s) { return s.k === curSub; })) curSub = 'all';
      renderHeader();                              // tab đổi trạng thái ngay
      if (!fromHistory) syncURL(true);
      var els = document.querySelectorAll('.fade-target');
      els.forEach(function (e) { e.classList.add('is-fading'); });
      clearTimeout(switching);
      switching = setTimeout(function () {
        renderAll();
        requestAnimationFrame(function () { els.forEach(function (e) { e.classList.remove('is-fading'); }); });
      }, 200);
    }
    /* Nút Back/Forward của trình duyệt */
    window.addEventListener('popstate', function () {
      var q = new URLSearchParams(location.search);
      var p = (q.get('p') || DEFAULT_P).replace(/[^a-z0-9]/g, '');
      curCat = q.get('cat') || 'all'; curSub = q.get('sub') || 'all';
      if (p !== curP) switchPeriod(p, true);
      else { if (!CAT[curCat]) curCat = 'all'; if (!CAT[curCat].sc.some(function (s) { return s.k === curSub; })) curSub = 'all'; renderAll(); }
    });
    /* ---------- khởi động ---------- */
    window.addEventListener('load', function () {
      if (!CAT || !Object.keys(CAT).length) {
        document.body.innerHTML = '<div class="mx-auto max-w-xl p-10 text-center"><h2 class="text-xl font-bold text-rose-600">Lỗi tải dữ liệu</h2>' +
          '<p class="mt-3 text-slate-600">' + esc(DATA_ERROR || 'Không nạp được data.') + '</p>' +
          '<p class="mt-3 text-sm text-slate-500">Kiểm tra file <b>data/2026/ecom_data_' + esc(curP) + '.js</b> có tồn tại và không lỗi cú pháp. Chạy <code>node .claude/skills/update-ecom-from-raw/scripts/check_data.js</code> để kiểm tra.</p></div>';
        return;
      }
      if (typeof Chart !== 'undefined') {
        Chart.defaults.font.family = '"Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif';
        Chart.defaults.color = '#64748b';
        Chart.defaults.plugins.tooltip.backgroundColor = '#0f172a';
        Chart.defaults.plugins.tooltip.padding = 10;
        Chart.defaults.plugins.tooltip.cornerRadius = 8;
      }
      if (!CAT[curCat]) curCat = 'all';
      if (!CAT[curCat].sc.some(function (s) { return s.k === curSub; })) curSub = 'all';
      renderHeader();
      syncURL();
      renderAll();
    });
  </script>
</body>

</html>
